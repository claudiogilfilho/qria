<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QRIA — Preview</title><style>body{font-family:Arial,sans-serif;background:#f7f4ed;color:#24251c;margin:0}header{padding:24px;background:#24251c;color:white}main{max-width:1100px;margin:auto;padding:24px}.card{background:white;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.06)}button{padding:12px 18px;border-radius:999px;border:1px solid #ccc;background:white;cursor:pointer}button.primary{background:#24251c;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.logo{height:120px;border-radius:18px;display:grid;place-items:center;font-size:34px;font-weight:700}.heart{float:right;font-size:22px}.fav{color:#d33}.hidden{display:none}input,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:12px;box-sizing:border-box}</style></head><body><header><h1>QRIA — Ateliê de Identidade</h1><div>Preview portátil de teste</div></header><main><section id="start" class="card"><h2>Criar marca</h2><input id="name" placeholder="Nome da marca"><textarea id="desc" placeholder="Descrição da marca"></textarea><textarea id="diff" placeholder="Diferenciais"></textarea><button class="primary" onclick="beginQuiz()">Começar diagnóstico</button></section><section id="quiz" class="card hidden"><h2 id="qtitle"></h2><div id="opts" class="grid"></div></section><section id="results" class="hidden"><div class="card"><h2>Explore as direções</h2><p>Favorite as que gostar ou aprofunde uma direção para gerar mais cinco variações.</p><button onclick="showFavorites()">❤️ Favoritas (<span id="favCount">0</span>)</button></div><div id="cards" class="grid"></div></section><section id="favorites" class="hidden"><div class="card"><h2>Suas favoritas</h2><button onclick="backResults()">Voltar</button></div><div id="favCards" class="grid"></div></section><section id="final" class="card hidden"><h2>Identidade escolhida</h2><div id="finalContent"></div><button onclick="resetAll()">Criar outra marca</button></section></main><script>const questions=[['Personalidade',['Sofisticada','Contemporânea','Ousada','Acolhedora','Visionária']],['Posicionamento',['Excelência','Praticidade','Exclusividade','Transformação','Pertencimento']],['Público',['Racional','Aspiracional','Sensível','Pioneiro','Pragmático']],['Estética',['Editorial','Minimalista','Orgânico','Geométrico','Experimental']],['Cor',['Neutro precioso','Profundo','Solar','Natural','Digital']]];let qi=0,answers=[],dirs=[],favs=[];const palettes=[['#24251c','#c4b96d','#f7f4ed'],['#2466ff','#c8ff00','#f2f4f8'],['#b95e46','#ede1cf','#3c2b25'],['#54222d','#e9bec6','#faf8f4'],['#18243a','#ff6b5f','#fff4df']];function beginQuiz(){if(!name.value.trim()){alert('Informe o nome da marca');return}start.classList.add('hidden');quiz.classList.remove('hidden');renderQ()}function renderQ(){if(qi>=questions.length){quiz.classList.add('hidden');generate();return}qtitle.textContent=questions[qi][0];opts.innerHTML='';questions[qi][1].forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{answers.push(o);qi++;renderQ()};opts.appendChild(b)})}function makeDirs(parent){const nm=name.value.trim();return Array.from({length:5},(_,i)=>({id:Date.now()+i,title:parent?parent.title+' · Variação '+(i+1):['Rota Essencial','Pulso Preciso','Matéria Humana','Campo Editorial','Sinal Vivo'][i],pal:palettes[i],parent:parent?.id||null}))}function generate(parent){dirs=makeDirs(parent);results.classList.remove('hidden');favorites.classList.add('hidden');renderCards()}function renderCards(){cards.innerHTML='';dirs.forEach((d,i)=>cards.appendChild(card(d)))}function card(d,finalMode=false){const c=document.createElement('div');c.className='card';const isFav=favs.some(f=>f.id===d.id);c.innerHTML=`<button class="heart ${isFav?'fav':''}">${isFav?'♥':'♡'}</button><div class="logo" style="background:${d.pal[0]};color:${d.pal[2]}">${name.value.slice(0,2).toUpperCase()}</div><h3>${d.title}</h3><p>Direção baseada no diagnóstico: ${answers.join(' · ')}</p><div>${d.pal.map(x=>`<span style="display:inline-block;width:24px;height:24px;border-radius:50%;background:${x};margin-right:6px"></span>`).join('')}</div>`;const hb=c.querySelector('.heart');hb.onclick=()=>toggleFav(d,hb);if(!finalMode){const ex=document.createElement('button');ex.textContent='Explorar esta direção';ex.onclick=()=>generate(d);c.appendChild(ex);const ch=document.createElement('button');ch.className='primary';ch.style.marginLeft='8px';ch.textContent='Escolher';ch.onclick=()=>choose(d);c.appendChild(ch)}return c}function toggleFav(d,b){const ix=favs.findIndex(f=>f.id===d.id);if(ix>=0)favs.splice(ix,1);else favs.push(d);favCount.textContent=favs.length;renderCards()}function showFavorites(){results.classList.add('hidden');favorites.classList.remove('hidden');favCards.innerHTML='';if(!favs.length){favCards.innerHTML='<div class="card">Nenhuma favorita ainda.</div>';return}favs.forEach(d=>{const c=card(d,true);const ex=document.createElement('button');ex.textContent='Explorar';ex.onclick=()=>generate(d);c.appendChild(ex);const ch=document.createElement('button');ch.className='primary';ch.style.marginLeft='8px';ch.textContent='Escolher final';ch.onclick=()=>choose(d);c.appendChild(ch);favCards.appendChild(c)})}function backResults(){favorites.classList.add('hidden');results.classList.remove('hidden')}function choose(d){results.classList.add('hidden');favorites.classList.add('hidden');final.classList.remove('hidden');finalContent.innerHTML=`<h3>${d.title}</h3><p>Marca: ${name.value}</p><p>Paleta definida, direção escolhida e pronta para Brand Kit.</p>`}function resetAll(){location.reload()}</script></body></html>
