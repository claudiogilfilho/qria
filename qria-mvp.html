<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QRIA MVP</title><style>:root{--ink:#23251c;--ivory:#f7f4ed;--gold:#c4b96d;--muted:#6f7168}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Inter,Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:var(--ink);color:white;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;letter-spacing:.12em}.btn{border:0;border-radius:999px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}.btn.alt{background:white;color:var(--ink);border:1px solid #d7d7d0}.btn.gold{background:var(--gold);color:var(--ink)}main{max-width:1120px;margin:auto;padding:30px 18px 70px}.hero,.card{border:1px solid #ddd;border-radius:26px;background:white;padding:28px}.hero{background:var(--ink);color:white;padding:48px}.hero h1{font-size:54px;line-height:.95;max-width:760px;margin:8px 0 20px}.hero p{max-width:650px;color:#d9d9d3;line-height:1.6}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:900;color:var(--gold)}input,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:12px;margin:6px 0 14px;font:inherit}textarea{min-height:94px}.opt{display:block;width:100%;text-align:left;border:1px solid #d7d7d0;background:white;border-radius:14px;padding:15px;margin:8px 0;cursor:pointer;font-weight:700}.opt:hover{border-color:var(--gold);background:#fffdf6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.proposal{background:white;border:1px solid #ddd;border-radius:22px;overflow:hidden}.visual{height:180px;display:grid;place-items:center;font-size:54px}.content{padding:18px}.muted{color:var(--muted);font-size:14px;line-height:1.5}.heart{float:right;border:0;background:#fff;width:42px;height:42px;border-radius:50%;font-size:22px;cursor:pointer;box-shadow:0 3px 12px #0002}.heart.on{color:#c43b52}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.top{display:flex;justify-content:space-between;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:20px}.pill{font-size:12px;background:#eee;border-radius:999px;padding:6px 10px}@media(max-width:700px){.hero{padding:28px}.hero h1{font-size:39px}}</style></head><body><header><div class="logo">QRIA</div><div><button class="btn alt" id="home">Início</button> <button class="btn alt" id="fav">♥ Favoritas <span id="count">0</span></button></div></header><main id="app"></main><script>const A=document.getElementById('app'),Q=[['Essência','Se a sua marca entrasse em uma sala, como você gostaria que ela fosse percebida?',['Sofisticada','Contemporânea','Ousada','Acolhedora','Visionária']],['Posicionamento','Qual promessa deve ficar mais clara quando alguém encontra sua marca?',['Excelência','Praticidade','Exclusividade','Transformação','Pertencimento']],['Público','Como o público ideal costuma tomar decisões?',['Racional','Aspiracional','Sensível','Pioneiro','Pragmático']],['Estética','Qual universo visual mais combina com o futuro da marca?',['Editorial','Minimalista','Orgânico','Geométrico','Experimental']],['Cor','Qual clima cromático deve liderar a percepção da marca?',['Neutro precioso','Profundo','Solar','Natural','Digital']]];let s={screen:'home',brand:null,q:0,answers:[],round:0,props:[],favs:[],selected:null};try{s=JSON.parse(localStorage.getItem('qria-mvp'))||s}catch{}function save(){localStorage.setItem('qria-mvp',JSON.stringify(s));document.getElementById('count').textContent=s.favs.length}function upd(){save();render()}function reset(){s={screen:'form',brand:null,q:0,answers:[],round:0,props:[],favs:[],selected:null};upd()}function palette(i){return [['#23251c','#c4b96d'],['#2466ff','#c8ff00'],['#b95e46','#ede1cf'],['#54222d','#e9bec6'],['#18243a','#ff6b5f']][i]}function gen(parent){s.round++;let n=['Rota Essencial','Pulso Preciso','Matéria Humana','Campo Editorial','Sinal Vivo'],st=['Clareza estratégica','Impacto contemporâneo','Proximidade autoral','Elegância cultural','Expressividade memorável'];s.props=n.map((x,i)=>({id:Date.now()+i,title:(parent?parent.title+' · ':'')+x+' '+s.round,style:st[i],colors:palette(i),depth:parent?(parent.depth||0)+1:0,parent:parent?.id||null}));s.screen='explore';upd()}function fav(p){let i=s.favs.findIndex(x=>x.id===p.id);i>=0?s.favs.splice(i,1):s.favs.push(p);upd()}function pick(p){s.selected=p;s.screen='final';upd()}function render(){if(s.screen==='home'){A.innerHTML='<section class="hero"><div class="eyebrow">Ateliê de identidade</div><h1>Toda marca memorável começa com uma escolha bem feita.</h1><p>Crie a marca, responda ao diagnóstico, explore cinco direções, favorite o que gostar e aprofunde qualquer caminho antes da escolha final.</p><button class="btn gold" onclick="reset()">Iniciar uma marca</button></section>';return}if(s.screen==='form'){A.innerHTML='<section class="card"><div class="eyebrow">Nova marca</div><h1>Conte o essencial.</h1><input id="nm" placeholder="Nome da marca"><textarea id="ds" placeholder="O que a empresa faz?"></textarea><textarea id="df" placeholder="Quais são os diferenciais?"></textarea><button class="btn" id="go">Continuar</button></section>';go.onclick=()=>{s.brand={name:nm.value||'Minha Marca',desc:ds.value||'Descrição',diff:df.value||'Diferenciais'};s.screen='quiz';upd()};return}if(s.screen==='quiz'){let q=Q[s.q];A.innerHTML='<section class="card"><div class="top"><div><div class="eyebrow">'+q[0]+'</div><div class="muted">Pergunta '+(s.q+1)+' de '+Q.length+'</div></div><span class="pill">'+Math.round(s.q/Q.length*100)+'%</span></div><h2>'+q[1]+'</h2>'+q[2].map((o,i)=>'<button class="opt" onclick="ans('+i+')">'+String.fromCharCode(65+i)+' · '+o+'</button>').join('')+'</section>';return}if(s.screen==='explore'){A.innerHTML='<div class="top"><div><div class="eyebrow">Exploração criativa</div><h1>Guarde o que gostar. Explore o que despertar algo.</h1><p class="muted">O coração salva a proposta. Explorar cria cinco variações descendentes sem apagar suas favoritas.</p></div>'+(s.favs.length?'<button class="btn" onclick="s.screen=\'favs\';upd()">Ver favoritas ('+s.favs.length+')</button>':'')+'</div><div class="grid">'+s.props.map(p=>'<article class="proposal"><div class="visual" style="background:'+p.colors[0]+';color:'+p.colors[1]+'">✦</div><div class="content"><button class="heart '+(s.favs.some(f=>f.id===p.id)?'on':'')+'" onclick="fav(s.props.find(x=>x.id==='+p.id+'))">♥</button><div class="eyebrow">'+(p.depth?'Nível '+p.depth:'Direção raiz')+'</div><h3>'+p.title+'</h3><p class="muted">'+p.style+'</p><div class="actions"><button class="btn alt" onclick="gen(s.props.find(x=>x.id==='+p.id+'))">Explorar esta direção</button></div></div></article>').join('')+'</div>';return}if(s.screen==='favs'){A.innerHTML='<div class="eyebrow">Sua curadoria</div><h1>Suas favoritas, lado a lado.</h1><p class="muted">Continue explorando ou escolha a identidade vencedora.</p><div class="grid">'+(s.favs.length?s.favs.map(p=>'<article class="proposal"><div class="visual" style="background:'+p.colors[0]+';color:'+p.colors[1]+'">♥</div><div class="content"><h3>'+p.title+'</h3><p class="muted">'+p.style+'</p><div class="actions"><button class="btn alt" onclick="gen(s.favs.find(x=>x.id==='+p.id+'))">Explorar mais</button><button class="btn" onclick="pick(s.favs.find(x=>x.id==='+p.id+'))">Escolher final</button></div></div></article>').join(''):'<section class="card">Você ainda não favoritou nenhuma direção.</section>')+'</div>';return}if(s.screen==='final'){let p=s.selected;A.innerHTML='<section class="card"><div class="eyebrow">Identidade escolhida</div><h1>'+(s.brand?.name||'Sua marca')+'</h1><div class="visual" style="background:'+p.colors[0]+';color:'+p.colors[1]+';border-radius:22px;margin:18px 0">✦</div><h2>'+p.title+'</h2><p class="muted">'+p.style+'</p><div class="actions"><button class="btn alt" onclick="s.screen=\'favs\';upd()">Voltar às favoritas</button><button class="btn" onclick="alert(\'Próxima etapa do MVP: Brand Kit e variações profissionais da logomarca.\')">Continuar para Brand Kit</button></div></section>'}}window.reset=reset;window.gen=gen;window.fav=fav;window.pick=pick;window.ans=i=>{s.answers.push(i);s.q++;s.q>=Q.length?gen():upd()};home.onclick=()=>{s.screen='home';upd()};document.getElementById('fav').onclick=()=>{s.screen='favs';upd()};upd();</script></body></html>
