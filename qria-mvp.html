<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QRIA MVP</title><style>:root{--ink:#1f211a;--ivory:#f7f4ed;--gold:#c4b96d;--muted:#6f7168;--line:#deddd6}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Inter,Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;letter-spacing:.14em}.btn{border:0;border-radius:999px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff}.btn.alt{background:#fff;color:var(--ink);border:1px solid #d7d7d0}.btn.gold{background:var(--gold);color:var(--ink)}main{max-width:1180px;margin:auto;padding:30px 18px 70px}.hero,.card{border:1px solid var(--line);border-radius:28px;background:#fff;padding:28px}.hero{background:var(--ink);color:#fff;padding:50px}.hero h1{font-size:56px;line-height:.95;max-width:760px;margin:8px 0 20px}.hero p{max-width:680px;color:#d9d9d3;line-height:1.65}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:900;color:var(--gold)}input,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:12px;margin:6px 0 14px;font:inherit}textarea{min-height:94px}.opt{display:block;width:100%;text-align:left;border:1px solid #d7d7d0;background:#fff;border-radius:14px;padding:15px;margin:8px 0;cursor:pointer;font-weight:700}.opt:hover{border-color:var(--gold);background:#fffdf6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}.proposal{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 10px 28px #0000000d}.brandstage{height:245px;display:grid;place-items:center;padding:22px;position:relative}.brandlock{display:flex;align-items:center;gap:16px;max-width:100%}.brandlock.vert{flex-direction:column;gap:9px}.wordmark{font-weight:900;letter-spacing:.025em;font-size:30px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}.symbol{width:78px;height:78px;flex:0 0 auto}.symbol svg{display:block;width:100%;height:100%}.content{padding:18px}.muted{color:var(--muted);font-size:14px;line-height:1.55}.heart{float:right;border:0;background:#fff;width:42px;height:42px;border-radius:50%;font-size:22px;cursor:pointer;box-shadow:0 3px 12px #0002}.heart.on{color:#c43b52}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.top{display:flex;justify-content:space-between;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:20px}.pill{font-size:12px;background:#eee;border-radius:999px;padding:6px 10px}.swatches{display:flex;gap:7px;margin-top:12px}.sw{width:22px;height:22px;border-radius:50%;border:1px solid #0002}.previewtabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}.previewtabs button{border:1px solid #d6d5ce;background:#fff;border-radius:999px;padding:8px 11px;font-weight:700;cursor:pointer}.deliver{display:grid;grid-template-columns:1.25fr .75fr;gap:22px}.mockgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mock{min-height:200px;border-radius:20px;display:grid;place-items:center;padding:18px;border:1px solid var(--line)}.downloadbox{border:1px solid var(--line);border-radius:20px;padding:20px;background:#fff}.downloadbox .btn{width:100%;margin:5px 0}.fine{font-size:12px;color:var(--muted)}@media(max-width:760px){.hero{padding:30px}.hero h1{font-size:40px}.deliver{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.wordmark{font-size:25px;max-width:190px}}</style></head><body><header><div class="logo">QRIA</div><div><button class="btn alt" id="home">Início</button> <button class="btn alt" id="fav">♥ Favoritas <span id="count">0</span></button></div></header><main id="app"></main><script>const A=document.getElementById('app'),Q=[['Essência','Se a sua marca entrasse em uma sala, como você gostaria que ela fosse percebida?',['Sofisticada','Contemporânea','Ousada','Acolhedora','Visionária']],['Posicionamento','Qual promessa deve ficar mais clara quando alguém encontra sua marca?',['Excelência','Praticidade','Exclusividade','Transformação','Pertencimento']],['Público','Como o público ideal costuma tomar decisões?',['Racional','Aspiracional','Sensível','Pioneiro','Pragmático']],['Estética','Qual universo visual mais combina com o futuro da marca?',['Editorial','Minimalista','Orgânico','Geométrico','Experimental']],['Cor','Qual clima cromático deve liderar a percepção da marca?',['Neutro precioso','Profundo','Solar','Natural','Digital']]];let s={screen:'home',brand:null,q:0,answers:[],round:0,props:[],favs:[],selected:null};try{s=JSON.parse(localStorage.getItem('qria-mvp-v2'))||s}catch{}function save(){localStorage.setItem('qria-mvp-v2',JSON.stringify(s));document.getElementById('count').textContent=s.favs.length}function upd(){save();render()}function reset(){s={screen:'form',brand:null,q:0,answers:[],round:0,props:[],favs:[],selected:null};upd()}function pal(i){return [['#20231d','#d4c76e','#f7f4ed'],['#0b2c43','#58d1c9','#eef8f7'],['#562c2a','#e2a178','#fff6ef'],['#291f33','#d7b3ff','#fbf8ff'],['#17262d','#ff765e','#f6eee5']][i]}function symbolSvg(i,fg,bg){let shapes=[`<circle cx='50' cy='50' r='33' fill='none' stroke='${fg}' stroke-width='8'/><path d='M50 19V81M19 50H81' stroke='${fg}' stroke-width='8' stroke-linecap='round'/>`,`<path d='M18 66L50 18L82 66L50 82Z' fill='none' stroke='${fg}' stroke-width='8' stroke-linejoin='round'/><circle cx='50' cy='55' r='9' fill='${fg}'/>`,`<path d='M24 70C24 38 42 22 67 22C50 36 45 50 45 75' fill='none' stroke='${fg}' stroke-width='9' stroke-linecap='round'/><circle cx='69' cy='69' r='12' fill='${fg}'/>`,`<rect x='18' y='18' width='64' height='64' rx='18' fill='none' stroke='${fg}' stroke-width='8'/><path d='M32 61L49 38L68 61' fill='none' stroke='${fg}' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/>`,`<path d='M50 14C62 32 77 37 86 50C77 63 62 68 50 86C38 68 23 63 14 50C23 37 38 32 50 14Z' fill='none' stroke='${fg}' stroke-width='8'/><circle cx='50' cy='50' r='10' fill='${fg}'/>`];return `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='${bg}'/>${shapes[i%5]}</svg>`}function gen(parent){s.round++;let n=['Monograma Essencial','Selo Contemporâneo','Símbolo Autoral','Assinatura Editorial','Marca Modular'],st=['Sofisticação minimalista','Precisão contemporânea','Expressividade premium','Elegância editorial','Sistema visual flexível'];s.props=n.map((x,i)=>({id:Date.now()+i,title:(parent?parent.title.split(' · ')[0]+' · ':'')+x,style:st[i],colors:parent?parent.colors:pal(i),symbolIndex:parent?((parent.symbolIndex+i+1)%5):i,depth:parent?(parent.depth||0)+1:0,parent:parent?.id||null,layout:i%2?'horizontal':'vertical'}));s.screen='explore';upd()}function fav(p){let i=s.favs.findIndex(x=>x.id===p.id);i>=0?s.favs.splice(i,1):s.favs.push(JSON.parse(JSON.stringify(p)));upd()}function pick(p){s.selected=p;s.screen='final';upd()}function logoHTML(p,bg,fg,vert=false){let brand=(s.brand?.name||'Minha Marca');return `<div class='brandlock ${vert?'vert':''}'><div class='symbol'>${symbolSvg(p.symbolIndex,fg,bg)}</div><div class='wordmark' style='color:${fg}'>${brand}</div></div>`}function card(p){let on=s.favs.some(f=>f.id===p.id),bg=p.colors[2],fg=p.colors[0];return `<article class='proposal'><div class='brandstage' style='background:${bg}'>${logoHTML(p,bg,fg,p.layout==='vertical')}</div><div class='content'><button class='heart ${on?'on':''}' onclick='fav(s.props.find(x=>x.id===${p.id}))'>♥</button><div class='eyebrow'>${p.depth?'Exploração nível '+p.depth:'Direção inicial'}</div><h3>${p.title}</h3><p class='muted'>${p.style}. Logomarca composta por símbolo + nome, pensada para funcionar como assinatura de marca e não apenas como ícone.</p><div class='swatches'>${p.colors.map(c=>`<span class='sw' style='background:${c}'></span>`).join('')}</div><div class='actions'><button class='btn alt' onclick='gen(s.props.find(x=>x.id===${p.id}))'>Aprofundar esta marca</button><button class='btn' onclick='pick(s.props.find(x=>x.id===${p.id}))'>Ver aplicações</button></div></div></article>`}function svgExport(p,transparent){let W=1200,H=500,bg=transparent?'none':p.colors[2],fg=p.colors[0],name=(s.brand?.name||'Minha Marca').replace(/&/g,'&amp;').replace(/</g,'&lt;');let sym=symbolSvg(p.symbolIndex,fg,transparent?'transparent':p.colors[2]).replace('<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'>','').replace('</svg>','');return `<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H}' viewBox='0 0 ${W} ${H}'>${transparent?'':`<rect width='100%' height='100%' fill='${bg}'/>`}<g transform='translate(80 130) scale(2.4)'>${sym}</g><text x='370' y='295' font-family='Arial,Helvetica,sans-serif' font-size='92' font-weight='800' letter-spacing='2' fill='${fg}'>${name}</text></svg>`}function dlBlob(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadSVG(trans){let p=s.selected;dlBlob((s.brand?.name||'marca').replace(/\s+/g,'-').toLowerCase()+(trans?'-transparente':'')+'.svg',svgExport(p,trans),'image/svg+xml')}function downloadPNG(trans){let p=s.selected,svg=svgExport(p,trans),img=new Image(),blob=new Blob([svg],{type:'image/svg+xml'}),url=URL.createObjectURL(blob);img.onload=()=>{let c=document.createElement('canvas');c.width=1800;c.height=750;let x=c.getContext('2d');if(!trans){x.fillStyle=p.colors[2];x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(s.brand?.name||'marca').replace(/\s+/g,'-').toLowerCase()+(trans?'-transparente':'')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')};img.src=url}function render(){if(s.screen==='home'){A.innerHTML=`<section class='hero'><div class='eyebrow'>MVP de identidade visual</div><h1>Da estratégia à logomarca utilizável.</h1><p>O QRIA cria direções de marca completas, permite aprofundar as melhores e entrega a escolhida em aplicações reais, fundo claro, fundo escuro e arquivos exportáveis.</p><button class='btn gold' onclick='reset()'>Criar uma marca</button></section>`;return}if(s.screen==='form'){A.innerHTML=`<section class='card'><div class='eyebrow'>Nova marca</div><h1>Conte o essencial.</h1><input id='nm' placeholder='Nome da empresa / marca'><textarea id='ds' placeholder='O que a empresa faz?'></textarea><textarea id='df' placeholder='Quais são os diferenciais?'></textarea><button class='btn' id='go'>Continuar</button></section>`;go.onclick=()=>{s.brand={name:nm.value||'Minha Marca',desc:ds.value||'Descrição',diff:df.value||'Diferenciais'};s.screen='quiz';upd()};return}if(s.screen==='quiz'){let q=Q[s.q];A.innerHTML=`<section class='card'><div class='top'><div><div class='eyebrow'>${q[0]}</div><div class='muted'>Pergunta ${s.q+1} de ${Q.length}</div></div><span class='pill'>${Math.round(s.q/Q.length*100)}%</span></div><h2>${q[1]}</h2>${q[2].map((o,i)=>`<button class='opt' onclick='ans(${i})'>${String.fromCharCode(65+i)} · ${o}</button>`).join('')}</section>`;return}if(s.screen==='explore'){A.innerHTML=`<div class='top'><div><div class='eyebrow'>Exploração de logomarcas</div><h1>Agora você está escolhendo uma marca — não um símbolo.</h1><p class='muted'>Cada direção já combina símbolo e nome. Favorite, aprofunde ou veja aplicações antes de decidir.</p></div>${s.favs.length?`<button class='btn' onclick="s.screen='favs';upd()">Ver favoritas (${s.favs.length})</button>`:''}</div><div class='grid'>${s.props.map(card).join('')}</div>`;return}if(s.screen==='favs'){A.innerHTML=`<div class='eyebrow'>Sua curadoria</div><h1>Suas logomarcas favoritas.</h1><p class='muted'>Aprofunde sem perder a direção ou abra as aplicações para escolher a vencedora.</p><div class='grid'>${s.favs.length?s.favs.map(p=>`<article class='proposal'><div class='brandstage' style='background:${p.colors[2]}'>${logoHTML(p,p.colors[2],p.colors[0],p.layout==='vertical')}</div><div class='content'><h3>${p.title}</h3><p class='muted'>${p.style}</p><div class='actions'><button class='btn alt' onclick='gen(s.favs.find(x=>x.id===${p.id}))'>Aprofundar</button><button class='btn' onclick='pick(s.favs.find(x=>x.id===${p.id}))'>Ver aplicações</button></div></div></article>`).join(''):`<section class='card'>Você ainda não favoritou nenhuma proposta.</section>`}</div>`;return}if(s.screen==='final'){let p=s.selected,name=s.brand?.name||'Minha Marca',light=p.colors[2],dark=p.colors[0],accent=p.colors[1];A.innerHTML=`<div class='top'><div><div class='eyebrow'>Entrega da marca</div><h1>${name}</h1><p class='muted'>Confira a mesma logomarca em diferentes condições antes de baixar.</p></div><button class='btn alt' onclick="s.screen='favs';upd()">Voltar às favoritas</button></div><section class='deliver'><div><div class='mockgrid'><div class='mock' style='background:${light}'>${logoHTML(p,light,dark,false)}</div><div class='mock' style='background:${dark}'>${logoHTML(p,dark,light,false)}</div><div class='mock' style='background:${accent}'>${logoHTML(p,accent,dark,false)}</div><div class='mock' style='background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 50%/24px 24px'>${logoHTML(p,'transparent',dark,false)}</div></div><div class='card' style='margin-top:14px'><div class='eyebrow'>Sistema de marca</div><h2>${p.title}</h2><p class='muted'>${p.style}. A versão horizontal é a assinatura principal. O símbolo isolado pode ser usado em avatar, favicon e aplicações reduzidas.</p></div></div><aside class='downloadbox'><div class='eyebrow'>Arquivos</div><h2>Baixe sua marca</h2><p class='muted'>Arquivos gerados diretamente no navegador neste MVP.</p><button class='btn' onclick='downloadPNG(false)'>PNG com fundo</button><button class='btn alt' onclick='downloadPNG(true)'>PNG transparente</button><button class='btn alt' onclick='downloadSVG(false)'>SVG com fundo</button><button class='btn alt' onclick='downloadSVG(true)'>SVG transparente</button><p class='fine'>MVP: as propostas são construídas por um sistema vetorial parametrizado. Na versão com IA conectada, o mesmo fluxo poderá usar geração criativa real mantendo estes formatos de entrega.</p></aside></section>`}}window.reset=reset;window.gen=gen;window.fav=fav;window.pick=pick;window.downloadPNG=downloadPNG;window.downloadSVG=downloadSVG;window.ans=i=>{s.answers.push(i);s.q++;s.q>=Q.length?gen():upd()};home.onclick=()=>{s.screen='home';upd()};document.getElementById('fav').onclick=()=>{s.screen='favs';upd()};upd();</script></body></html>
