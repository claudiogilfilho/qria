<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QRIA MVP</title><style>:root{--ink:#1f211a;--ivory:#f7f4ed;--gold:#c4b96d;--muted:#6f7168;--line:#deddd6}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Inter,Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;letter-spacing:.14em}.btn{border:0;border-radius:999px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff}.btn.alt{background:#fff;color:var(--ink);border:1px solid #d7d7d0}.btn.gold{background:var(--gold);color:var(--ink)}.btn.danger{background:#fff3f3;color:#9a2d2d;border:1px solid #efcaca}main{max-width:1180px;margin:auto;padding:30px 18px 70px}.hero,.card{border:1px solid var(--line);border-radius:28px;background:#fff;padding:28px}.hero{background:var(--ink);color:#fff;padding:48px}.hero h1{font-size:54px;line-height:.95;max-width:760px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:900;color:var(--gold)}input,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:12px;margin:6px 0 14px;font:inherit}textarea{min-height:94px}.opt{display:block;width:100%;text-align:left;border:1px solid #d7d7d0;background:#fff;border-radius:14px;padding:15px;margin:8px 0;cursor:pointer;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}.proposal{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden}.brandstage{height:245px;display:grid;place-items:center;padding:22px}.brandlock{display:flex;align-items:center;gap:16px}.brandlock.vert{flex-direction:column;gap:10px}.wordmark{font-weight:900;font-size:30px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.symbol{width:78px;height:78px}.symbol svg{width:100%;height:100%}.content{padding:18px}.muted{color:var(--muted);font-size:14px;line-height:1.55}.heart{float:right;border:0;background:#fff;width:42px;height:42px;border-radius:50%;font-size:22px;cursor:pointer;box-shadow:0 3px 12px #0002}.heart.on{color:#c43b52}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.top{display:flex;justify-content:space-between;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:20px}.swatches{display:flex;gap:7px;margin-top:12px}.sw{width:25px;height:25px;border-radius:50%;border:1px solid #0002;cursor:pointer}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.mockgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mock{min-height:200px;border-radius:20px;display:grid;place-items:center;padding:18px;border:1px solid var(--line)}@media(max-width:760px){.hero h1{font-size:40px}.grid{grid-template-columns:1fr}.mockgrid{grid-template-columns:1fr}}</style></head><body><header><div class="logo">QRIA</div><div><button class="btn alt" id="home">Início</button> <button class="btn alt" id="fav">♥ Favoritas <span id="count">0</span></button></div></header><main id="app"></main><script>const A=document.getElementById('app');const Q=[['Essência','Como sua marca deve ser percebida?',['Sofisticada','Contemporânea','Ousada','Acolhedora','Visionária']],['Posicionamento','Qual promessa deve ficar mais clara?',['Excelência','Praticidade','Exclusividade','Transformação','Pertencimento']],['Estética','Qual universo visual mais combina?',['Editorial','Minimalista','Orgânico','Geométrico','Experimental']],['Cor','Qual clima cromático deve liderar?',['Neutro precioso','Profundo','Solar','Natural','Digital']]];const P=[['#20231d','#d4c76e','#f7f4ed'],['#0b2c43','#58d1c9','#eef8f7'],['#562c2a','#e2a178','#fff6ef'],['#5b3b73','#cda9f2','#fbf7ff'],['#17262d','#ff765e','#f6eee5'],['#23213c','#9b8cff','#f3f1ff'],['#403121','#e7bd7e','#fff8eb']];let s={screen:'home',brand:null,q:0,answers:[],round:0,props:[],favs:[],selected:null,seed:0};try{s=JSON.parse(localStorage.getItem('qria-mvp-v3'))||s}catch{}function save(){localStorage.setItem('qria-mvp-v3',JSON.stringify(s));count.textContent=s.favs.length}function upd(){save();render()}function reset(){s={screen:'form',brand:null,q:0,answers:[],round:0,props:[],favs:[],selected:null,seed:0};upd()}function sym(i,fg,bg){let sh=[`<circle cx='50' cy='50' r='31' fill='none' stroke='${fg}' stroke-width='8'/><path d='M50 20V80M20 50H80' stroke='${fg}' stroke-width='8' stroke-linecap='round'/>`,`<path d='M18 66L50 18L82 66L50 82Z' fill='none' stroke='${fg}' stroke-width='8'/><circle cx='50' cy='55' r='9' fill='${fg}'/>`,`<path d='M24 70C24 38 42 22 67 22C50 36 45 50 45 75' fill='none' stroke='${fg}' stroke-width='9' stroke-linecap='round'/><circle cx='69' cy='69' r='12' fill='${fg}'/>`,`<rect x='18' y='18' width='64' height='64' rx='18' fill='none' stroke='${fg}' stroke-width='8'/><path d='M32 61L49 38L68 61' fill='none' stroke='${fg}' stroke-width='8'/>`,`<path d='M50 14C62 32 77 37 86 50C77 63 62 68 50 86C38 68 23 63 14 50C23 37 38 32 50 14Z' fill='none' stroke='${fg}' stroke-width='8'/><circle cx='50' cy='50' r='10' fill='${fg}'/>`];return `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='${bg}'/>${sh[i%5]}</svg>`}function logo(p,bg,fg,vert=false){return `<div class='brandlock ${vert?'vert':''}'><div class='symbol'>${sym(p.symbolIndex,fg,bg)}</div><div class='wordmark' style='color:${fg}'>${s.brand?.name||'Minha Marca'}</div></div>`}function newRound(parent=null){s.round++;let names=['Essencial','Contemporânea','Autoral','Editorial','Modular'];s.props=names.map((n,i)=>({id:Date.now()+i,title:parent?parent.title+' · variação '+(i+1):'Direção '+n,style:parent?'Variação fiel à identidade-base':'Nova direção visual',colors:parent?[...parent.colors]:P[(i+s.seed)%P.length],symbolIndex:parent?(parent.symbolIndex+i)%5:i,layout:parent?(i%2?'horizontal':'vertical'):(i%2?'horizontal':'vertical'),depth:parent?(parent.depth||0)+1:0,parent:parent?.id||null}));s.screen='explore';upd()}function rejectAll(){s.seed=(s.seed+2)%P.length;newRound(null)}function fav(p){let i=s.favs.findIndex(x=>x.id===p.id);i>=0?s.favs.splice(i,1):s.favs.push(JSON.parse(JSON.stringify(p)));upd()}function cycleColor(id){let p=s.props.find(x=>x.id===id);if(!p)return;let idx=P.findIndex(x=>x[0]===p.colors[0]&&x[1]===p.colors[1]);p.colors=[...P[(idx+1+P.length)%P.length]];upd()}function pick(p){s.selected=JSON.parse(JSON.stringify(p));s.screen='final';upd()}function svgExport(p,transparent){let bg=transparent?'none':p.colors[2],fg=p.colors[0],name=(s.brand?.name||'Minha Marca').replace(/&/g,'&amp;').replace(/</g,'&lt;');let inner=sym(p.symbolIndex,fg,transparent?'transparent':p.colors[2]).replace(/<svg[^>]*>/,'').replace('</svg>','');return `<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='500' viewBox='0 0 1200 500'>${transparent?'':`<rect width='100%' height='100%' fill='${bg}'/>`}<g transform='translate(80 130) scale(2.4)'>${inner}</g><text x='370' y='295' font-family='Arial' font-size='92' font-weight='800' fill='${fg}'>${name}</text></svg>`}function dlSvg(p,transparent){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svgExport(p,transparent)],{type:'image/svg+xml'}));a.download=(s.brand?.name||'marca').replace(/\s+/g,'-').toLowerCase()+(transparent?'-transparente':'')+'.svg';a.click()}function dlPng(p,transparent){let img=new Image(),u=URL.createObjectURL(new Blob([svgExport(p,transparent)],{type:'image/svg+xml'}));img.onload=()=>{let c=document.createElement('canvas');c.width=1800;c.height=750;let x=c.getContext('2d');if(!transparent){x.fillStyle=p.colors[2];x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(s.brand?.name||'marca').replace(/\s+/g,'-').toLowerCase()+(transparent?'-transparente':'')+'.png';a.click()})};img.src=u}function card(p){let on=s.favs.some(f=>f.id===p.id);return `<article class='proposal'><div class='brandstage' style='background:${p.colors[2]}'>${logo(p,p.colors[2],p.colors[0],p.layout==='vertical')}</div><div class='content'><button class='heart ${on?'on':''}' onclick='fav(s.props.find(x=>x.id===${p.id}))'>♥</button><div class='eyebrow'>${p.depth?'Aprofundamento nível '+p.depth:'Direção inicial'}</div><h3>${p.title}</h3><p class='muted'>${p.style}. Símbolo, nome e composição permanecem reconhecíveis ao aprofundar.</p><div class='swatches'>${p.colors.map(c=>`<span class='sw' style='background:${c}'></span>`).join('')}<button class='btn alt' style='padding:6px 10px' onclick='cycleColor(${p.id})'>Trocar cores</button></div><div class='actions'><button class='btn alt' onclick='newRound(s.props.find(x=>x.id===${p.id}))'>Aprofundar em 5 opções</button><button class='btn alt' onclick='dlPng(s.props.find(x=>x.id===${p.id}),false)'>Baixar PNG</button><button class='btn alt' onclick='dlPng(s.props.find(x=>x.id===${p.id}),true)'>PNG transparente</button><button class='btn' onclick='pick(s.props.find(x=>x.id===${p.id}))'>Ver aplicações</button></div></div></article>`}function render(){if(s.screen==='home'){A.innerHTML=`<section class='hero'><div class='eyebrow'>MVP de identidade visual</div><h1>Crie, refine e baixe sua marca.</h1><p>Escolha entre direções completas, aprofunde uma delas em cinco variações, mude cores, favorite e baixe a proposta que quiser.</p><button class='btn gold' onclick='reset()'>Criar uma marca</button></section>`;return}if(s.screen==='form'){A.innerHTML=`<section class='card'><div class='eyebrow'>Nova marca</div><h1>Conte o essencial.</h1><input id='nm' placeholder='Nome da empresa / marca'><textarea id='ds' placeholder='O que a empresa faz?'></textarea><textarea id='df' placeholder='Quais são os diferenciais?'></textarea><button class='btn' id='go'>Continuar</button></section>`;go.onclick=()=>{s.brand={name:nm.value||'Minha Marca',desc:ds.value||'Descrição',diff:df.value||'Diferenciais'};s.screen='quiz';upd()};return}if(s.screen==='quiz'){let q=Q[s.q];A.innerHTML=`<section class='card'><div class='eyebrow'>${q[0]}</div><h2>${q[1]}</h2>${q[2].map((o,i)=>`<button class='opt' onclick='ans(${i})'>${String.fromCharCode(65+i)} · ${o}</button>`).join('')}</section>`;return}if(s.screen==='explore'){A.innerHTML=`<div class='top'><div><div class='eyebrow'>Exploração de logomarcas</div><h1>${s.props[0]?.depth?'Cinco variações da marca escolhida.':'Escolha, refine ou descarte a rodada.'}</h1><p class='muted'>Você pode aprofundar uma marca específica, trocar sua paleta, baixar imediatamente ou pedir uma rodada totalmente nova.</p></div></div><div class='toolbar'><button class='btn danger' onclick='rejectAll()'>Não gostei de nenhuma — gerar outras 5</button>${s.favs.length?`<button class='btn' onclick="s.screen='favs';upd()">Ver favoritas (${s.favs.length})</button>`:''}</div><div class='grid'>${s.props.map(card).join('')}</div>`;return}if(s.screen==='favs'){A.innerHTML=`<div class='eyebrow'>Favoritas</div><h1>Suas marcas salvas.</h1><div class='grid'>${s.favs.map(p=>`<article class='proposal'><div class='brandstage' style='background:${p.colors[2]}'>${logo(p,p.colors[2],p.colors[0],p.layout==='vertical')}</div><div class='content'><h3>${p.title}</h3><div class='actions'><button class='btn alt' onclick='newRound(s.favs.find(x=>x.id===${p.id}))'>Aprofundar em 5</button><button class='btn alt' onclick='dlPng(s.favs.find(x=>x.id===${p.id}),false)'>Baixar PNG</button><button class='btn' onclick='pick(s.favs.find(x=>x.id===${p.id}))'>Ver aplicações</button></div></div></article>`).join('')||'<section class=card>Nenhuma favorita ainda.</section>'}</div>`;return}if(s.screen==='final'){let p=s.selected,light=p.colors[2],dark=p.colors[0],accent=p.colors[1];A.innerHTML=`<div class='eyebrow'>Aplicações</div><h1>${s.brand?.name||'Minha Marca'}</h1><div class='mockgrid'><div class='mock' style='background:${light}'>${logo(p,light,dark,false)}</div><div class='mock' style='background:${dark}'>${logo(p,dark,light,false)}</div><div class='mock' style='background:${accent}'>${logo(p,accent,dark,false)}</div><div class='mock' style='background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 50%/24px 24px'>${logo(p,'transparent',dark,false)}</div></div><div class='toolbar'><button class='btn' onclick='dlPng(s.selected,false)'>Baixar PNG com fundo</button><button class='btn alt' onclick='dlPng(s.selected,true)'>Baixar PNG transparente</button><button class='btn alt' onclick='dlSvg(s.selected,false)'>Baixar SVG</button><button class='btn alt' onclick='dlSvg(s.selected,true)'>SVG transparente</button><button class='btn alt' onclick="s.screen='favs';upd()">Voltar às favoritas</button></div>`}}window.reset=reset;window.newRound=newRound;window.rejectAll=rejectAll;window.fav=fav;window.cycleColor=cycleColor;window.pick=pick;window.dlPng=dlPng;window.dlSvg=dlSvg;window.ans=i=>{s.answers.push(i);s.q++;s.q>=Q.length?newRound():upd()};home.onclick=()=>{s.screen='home';upd()};fav.onclick=()=>{s.screen='favs';upd()};upd();</script></body></html>
